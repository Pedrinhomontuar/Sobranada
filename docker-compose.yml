services:
  db:
    image: postgres:16
    container_name: sobranada-db
    environment:
      POSTGRES_USER: sobranada
      POSTGRES_PASSWORD: sobranada123
      POSTGRES_DB: sobranada
    ports: 
    - "5432:5432"
    volumes: 
    - sobranada-dados:/var/lib/postgresql/data

volumes:
  sobranada-dados: